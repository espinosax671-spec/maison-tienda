<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso — MAISON</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-family: 'Jost', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        linear-gradient(rgba(20,15,10,0.55), rgba(20,15,10,0.85)),
        url('https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
      color: #fff;
      padding: 24px;
    }
    .box { max-width: 420px; }
    .logo { font-size: 40px; letter-spacing: 10px; color: #c9a96e; margin-bottom: 16px; font-weight: 600; }
    p { color: #ddd; font-size: 15px; letter-spacing: 1px; margin-bottom: 28px; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 22px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #c9a96e;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #c9a96e; }
  </style>
  <script>
    if (window.location.pathname.toLowerCase().endsWith('/login.html') ||
        window.location.pathname.toLowerCase() === '/login.html' ||
        window.location.pathname.toLowerCase() === '/login') {
      window.location.replace('/admin.html');
    }
  </script>
</head>
<body>
  <div class="box">
    <div class="logo">MAISON</div>
    <div class="spinner"></div>
    <p>Redirigiendo al panel de administración...</p>
    <p style="margin-bottom:0; font-size:13px; color:#aaa;">
      Si no redirige automáticamente, <a href="/admin.html">entra aquí</a>.
    </p>
  </div>
</body>
</html>
